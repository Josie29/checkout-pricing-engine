# Fast local feedback only — CI is the actual gate (docs/clean-code-enforcement.md).
# Slow checks (pyright, tsc, pytest) deliberately stay CI-only.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: prettier
        name: prettier --check
        language: system
        entry: frontend/node_modules/.bin/prettier --check --ignore-path frontend/.prettierignore
        files: ^frontend/.*\.(ts|tsx|css|json|html)$
        exclude: ^frontend/package-lock\.json$
      - id: eslint
        name: eslint
        language: system
        entry: bash -c 'cd frontend && npm run --silent lint'
        pass_filenames: false
        files: ^frontend/.*\.(ts|tsx)$
