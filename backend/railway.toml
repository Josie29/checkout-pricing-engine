# Railway config-as-code for the `api` service (docs/deployment-plan.md).
# Service root directory: backend/ (set once by scripts/railway-bootstrap.sh).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["backend/**"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
