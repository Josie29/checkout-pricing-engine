[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pricing-engine"
version = "0.1.0"
description = "Checkout pricing engine API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "httpx>=0.27",
]

[tool.setuptools]
packages = ["app", "app.seeds"]

[tool.setuptools.package-data]
"app.seeds" = ["*.json"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "D",   # pydocstyle: docstring presence
]
ignore = [
    "D100", # module-level docstrings are deliberately not used
    "D104", # package (__init__) docstrings likewise
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

# Starlette's TestClient (httpx shim) has partially unknown method types under
# strict mode; relax only the unknown-type diagnostics, only for tests.
[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
